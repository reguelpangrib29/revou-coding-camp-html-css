<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit List</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-glass-bg: rgba(255, 255, 255, 0.15);
            --color-glass-border: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-violet-600 via-purple-500 to-pink-500">

    <!-- Decorative blobs -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-pink-400 rounded-full opacity-30 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-violet-400 rounded-full opacity-30 blur-3xl pointer-events-none"></div>

    <!-- Glassmorphism card -->
    <div class="relative z-10 w-full max-w-sm mx-4 rounded-3xl p-8
                bg-white/15 backdrop-blur-lg
                border border-white/30
                shadow-2xl shadow-black/20">

        <!-- Title -->
        <h1 class="text-3xl font-bold text-white text-center mb-1 tracking-wide drop-shadow">
            🍉 Fruit List
        </h1>
        <p class="text-white/60 text-center text-sm mb-6">A fresh collection of fruits</p>

        <!-- Divider -->
        <div class="h-px bg-white/20 mb-6"></div>

        <!-- List -->
        <ul class="space-y-3">
            <li class="flex items-center gap-3 bg-white/10 hover:bg-white/20 transition-colors duration-200
                        rounded-xl px-4 py-3 cursor-default">
                <span class="text-2xl">🥭</span>
                <span class="text-white font-medium text-lg">Mangga</span>
            </li>
            <li class="flex items-center gap-3 bg-white/10 hover:bg-white/20 transition-colors duration-200
                        rounded-xl px-4 py-3 cursor-default">
                <span class="text-2xl">🍌</span>
                <span class="text-white font-medium text-lg">Pisang</span>
            </li>
            <li class="flex items-center gap-3 bg-white/10 hover:bg-white/20 transition-colors duration-200
                        rounded-xl px-4 py-3 cursor-default">
                <span class="text-2xl">🍈</span>
                <span class="text-white font-medium text-lg">Jambu</span>
            </li>
        </ul>

        <!-- Footer -->
        <div class="h-px bg-white/20 mt-6 mb-4"></div>
        <p class="text-white/40 text-center text-xs">Made with Tailwind CSS v4</p>
    </div>

</body>
</html>
